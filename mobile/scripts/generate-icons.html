<!DOCTYPE html>
<html>
<head>
  <title>Generate PWA Icons</title>
</head>
<body>
  <h1>Right-click each canvas and "Save image as..."</h1>
  
  <h2>icon-192.png</h2>
  <canvas id="icon192" width="192" height="192"></canvas>
  
  <h2>icon-512.png</h2>
  <canvas id="icon512" width="512" height="512"></canvas>
  
  <h2>apple-touch-icon.png (180x180)</h2>
  <canvas id="apple" width="180" height="180"></canvas>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      
      // Background
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(0, 0, size, size);
      
      // Letter P
      ctx.fillStyle = '#60a5fa';
      ctx.font = `bold ${size * 0.45}px Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('P', size/2, size/2 + size*0.05);
    }
    
    drawIcon(document.getElementById('icon192'));
    drawIcon(document.getElementById('icon512'));
    drawIcon(document.getElementById('apple'));
  </script>
</body>
</html>
